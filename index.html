<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黒塗りアプリ - Evian Blackout</title>
    <link rel="stylesheet" href="style.css">
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖤 Evian Blackout</h1>
            <p>画像内のテキストを黒塗りにできます</p>
        </header>

        <main>
            <div class="input-section">
                <h2>1. 画像をアップロード</h2>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>クリックまたはドラッグ&ドロップで画像をアップロード</p>
                        <p class="upload-hint">PNG, JPG, GIF (最大10MB)</p>
                    </div>
                </div>
                <div class="button-group" style="margin-top: 20px;">
                    <button id="cameraBtn" class="btn btn-camera">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        カメラで撮影
                    </button>
                </div>
            </div>

            <div class="editor-section" id="editorSection" style="display: none;">
                <h2>2. 黒塗りエリアをドラッグで選択</h2>
                <p class="instruction">マウスをドラッグして黒塗りにしたいエリアを選択してください</p>

                <div class="canvas-container">
                    <canvas id="imageCanvas"></canvas>
                </div>

                <div class="button-group">
                    <button id="undoBtn" class="btn btn-secondary">最後の黒塗りを取り消す</button>
                    <button id="resetBtn" class="btn btn-secondary">すべてリセット</button>
                    <button id="downloadBtn" class="btn btn-success">画像をダウンロード</button>
                    <button id="newImageBtn" class="btn btn-primary">別の画像を選択</button>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2025 Evian Blackout App</p>
        </footer>
    </div>

    <!-- Camera Modal -->
    <div id="cameraModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📷 カメラで撮影</h2>
                <button id="closeCameraBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <video id="cameraVideo" autoplay playsinline></video>
                <canvas id="cameraCanvas" style="display: none;"></canvas>
            </div>
            <div class="modal-footer">
                <button id="captureBtn" class="btn btn-success">撮影する</button>
                <button id="cancelCameraBtn" class="btn btn-secondary">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- Evian Detection Popup -->
    <div id="evianPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon">💧</div>
            <h2>Evian検出！</h2>
            <p>画像にevianが含まれています</p>
            <button id="closePopupBtn" class="btn btn-primary">OK</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>画像を解析中...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
