<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黒塗りアプリ - Evian Blackout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🖤 Evian Blackout</h1>
            <p>画像内のテキストを黒塗りにできます</p>
        </header>

        <main>
            <div class="input-section">
                <h2>1. 画像をアップロード</h2>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>クリックまたはドラッグ&ドロップで画像をアップロード</p>
                        <p class="upload-hint">PNG, JPG, GIF (最大10MB)</p>
                    </div>
                </div>
            </div>

            <div class="editor-section" id="editorSection" style="display: none;">
                <h2>2. 黒塗りエリアをドラッグで選択</h2>
                <p class="instruction">マウスをドラッグして黒塗りにしたいエリアを選択してください</p>

                <div class="canvas-container">
                    <canvas id="imageCanvas"></canvas>
                </div>

                <div class="button-group">
                    <button id="undoBtn" class="btn btn-secondary">最後の黒塗りを取り消す</button>
                    <button id="resetBtn" class="btn btn-secondary">すべてリセット</button>
                    <button id="downloadBtn" class="btn btn-success">画像をダウンロード</button>
                    <button id="newImageBtn" class="btn btn-primary">別の画像を選択</button>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2025 Evian Blackout App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
